spring:
  application:
    name: aps
  datasource:
    # 仅占位符：真实连接由平台运行时注入 APS_DB_URL/USER/PASSWORD（技术方案 §8.6）
    url: ${APS_DB_URL}
    username: ${APS_DB_USER}
    password: ${APS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080
  shutdown: graceful

# JWT 密钥只从环境变量注入，缺失即 fail-fast（见 JwtProperties）
jwt:
  secret: ${APS_JWT_SECRET}
  expiration-ms: 3600000

# 本地文件存储（无 MinIO），目录可外部化，非敏感
storage:
  local-dir: ${APS_STORAGE_DIR:./data/files}

# 应用内 worker 轮询间隔（DB 任务表 + PG advisory lock）
aps:
  worker:
    poll-ms: 5000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aps: INFO
